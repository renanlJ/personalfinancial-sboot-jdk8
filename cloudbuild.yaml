steps:
  - name: maven:3-eclipse-temurin-17-alpine
    entrypoint: mvn
    args: ["package", "-Dmaven.test.skip=true"]
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "us-central1-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/personalfinancial-sboot-jdk8", "."]
images: ["us-central1-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/personalfinancial-sboot-jdk8"]

options:
  logging: CLOUD_LOGGING_ONLY